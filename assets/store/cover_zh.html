<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>淘金者封面</title>
<style>
html,body{margin:0;width:1152px;height:1536px;overflow:hidden;background:#0b0710}
.t{font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif}
</style></head><body>
<svg width="1152" height="1536" viewBox="0 0 1152 1536" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1a1240"/><stop offset=".55" stop-color="#7a3a5c"/><stop offset="1" stop-color="#f29a4a"/>
  </linearGradient>
  <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6b4325"/><stop offset=".25" stop-color="#5a3a2a"/>
    <stop offset=".5" stop-color="#3d3440"/><stop offset=".75" stop-color="#241d30"/><stop offset="1" stop-color="#120a14"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff6c2"/><stop offset=".45" stop-color="#ffd54a"/><stop offset=".55" stop-color="#f0a818"/><stop offset="1" stop-color="#b8620a"/>
  </linearGradient>
  <radialGradient id="lamp" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffe9a0" stop-opacity=".75"/><stop offset=".5" stop-color="#ffb84a" stop-opacity=".22"/><stop offset="1" stop-color="#ff9a2a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="lava" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ff6a1a" stop-opacity=".8"/><stop offset="1" stop-color="#ff2a00" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="dia" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#9ff4ff" stop-opacity=".9"/><stop offset="1" stop-color="#3ad0ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="rub" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ff7aa0" stop-opacity=".85"/><stop offset="1" stop-color="#ff2a5a" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".7"/></filter>
  <pattern id="tiles" width="144" height="144" patternUnits="userSpaceOnUse">
    <rect width="144" height="144" fill="none" stroke="#000" stroke-opacity=".28" stroke-width="4"/>
    <path d="M20 30h18M90 100h22M60 70l10 6M110 40l8-6" stroke="#fff" stroke-opacity=".06" stroke-width="5" stroke-linecap="round"/>
  </pattern>
  <g id="gem"><path d="M0-30 26-8 16 28h-32L-26-8z"/><path d="M0-30 10-8 0 28-10-8z" fill="#fff" fill-opacity=".35"/><path d="M-26-8h52" stroke="#fff" stroke-opacity=".5" stroke-width="3"/></g>
  <g id="nug"><path d="M-24 6c-4-16 10-28 24-26 18-2 30 12 24 26-4 14-18 18-28 16-12 0-18-6-20-16z" fill="url(#gold)" stroke="#7a3c00" stroke-width="3"/><circle cx="-6" cy="-6" r="5" fill="#fffbe0"/></g>
</defs>

<!-- sky -->
<rect width="1152" height="560" fill="url(#sky)"/>
<g fill="#fff" opacity=".8"><circle cx="120" cy="80" r="2.5"/><circle cx="300" cy="140" r="2"/><circle cx="520" cy="60" r="2"/><circle cx="820" cy="110" r="2.5"/><circle cx="1040" cy="70" r="2"/><circle cx="960" cy="200" r="1.8"/><circle cx="210" cy="230" r="1.6"/></g>
<circle cx="900" cy="470" r="110" fill="#ffcf6a" opacity=".55"/>
<path d="M0 470 L160 380 L290 450 L430 360 L600 455 L760 390 L900 460 L1040 400 L1152 440 V560 H0Z" fill="#3a2440" opacity=".85"/>

<!-- earth -->
<rect y="540" width="1152" height="996" fill="url(#earth)"/>
<rect y="540" width="1152" height="996" fill="url(#tiles)"/>
<path d="M0 540 Q100 525 200 540 T400 538 T600 542 T800 536 T1000 542 T1152 538 V560 H0Z" fill="#5d8c3a"/>
<!-- layer bands -->
<path d="M0 820 Q300 800 600 826 T1152 812" stroke="#000" stroke-opacity=".25" stroke-width="6" fill="none"/>
<path d="M0 1100 Q300 1080 600 1110 T1152 1090" stroke="#000" stroke-opacity=".3" stroke-width="6" fill="none"/>

<!-- headframe / rope -->
<g transform="translate(250,400)">
  <path d="M-60 140 L0 0 L60 140" stroke="#5a3418" stroke-width="16" fill="none"/>
  <path d="M-40 90h80" stroke="#5a3418" stroke-width="12"/>
  <circle cx="0" cy="8" r="22" fill="#2a1a10" stroke="#c88a3a" stroke-width="6"/>
</g>
<line x1="250" y1="408" x2="250" y2="900" stroke="#d8b878" stroke-width="5" stroke-dasharray="14 6"/>

<!-- dug tunnel -->
<path d="M200 560 H300 V900 H560 V1150 H730 V1320 H530 V1200 H460 V990 H200Z" fill="#0d0810" opacity=".92"/>
<path d="M200 560 H300 V900 H560 V1150 H730 V1320 H530 V1200 H460 V990 H200Z" fill="none" stroke="#000" stroke-width="8" opacity=".6"/>

<!-- lantern glow around miner -->
<circle cx="630" cy="1230" r="300" fill="url(#lamp)"/>

<!-- ores -->
<g filter="url(#glow)">
  <use href="#nug" transform="translate(860,640) scale(1.1)"/>
  <use href="#nug" transform="translate(110,720) scale(.9)"/>
  <use href="#nug" transform="translate(760,960) scale(1.3)"/>
  <use href="#nug" transform="translate(380,1080)"/>
  <circle cx="980" cy="880" r="70" fill="url(#rub)"/>
  <use href="#gem" fill="#ff3a6a" transform="translate(980,880) scale(1.2)"/>
  <circle cx="160" cy="1210" r="60" fill="url(#rub)"/>
  <use href="#gem" fill="#ff3a6a" transform="translate(160,1210)"/>
  <circle cx="900" cy="1250" r="110" fill="url(#dia)"/>
  <use href="#gem" fill="#5ae4ff" transform="translate(900,1250) scale(1.7)"/>
  <circle cx="330" cy="1420" r="80" fill="url(#dia)"/>
  <use href="#gem" fill="#5ae4ff" transform="translate(330,1420) scale(1.2)"/>
</g>
<!-- coal/copper flecks -->
<g fill="#111"><circle cx="560" cy="660" r="14"/><circle cx="580" cy="676" r="10"/><circle cx="1050" cy="700" r="12"/></g>
<g fill="#d0703a"><circle cx="680" cy="760" r="10"/><circle cx="694" cy="772" r="7"/><circle cx="60" cy="930" r="10"/></g>

<!-- treasure chest -->
<g transform="translate(110,1060)" filter="url(#shadow)">
  <rect x="-60" y="-20" width="120" height="70" rx="8" fill="#7a3f12" stroke="#2a1205" stroke-width="5"/>
  <path d="M-60 -20 Q0 -80 60 -20Z" fill="#9a5418" stroke="#2a1205" stroke-width="5"/>
  <rect x="-60" y="0" width="120" height="12" fill="#e8b23a"/>
  <rect x="-12" y="-6" width="24" height="30" rx="4" fill="#ffd54a" stroke="#2a1205" stroke-width="3"/>
</g>

<!-- lava pool -->
<ellipse cx="760" cy="1500" rx="420" ry="90" fill="url(#lava)"/>
<path d="M420 1536 Q520 1470 640 1490 T880 1480 T1152 1490 V1536Z" fill="#ff4a10"/>
<path d="M460 1536 Q560 1495 660 1508 T900 1500 T1152 1512 V1536Z" fill="#ffb02a"/>
<g fill="#ffd06a" opacity=".9"><circle cx="700" cy="1460" r="6"/><circle cx="820" cy="1440" r="4"/><circle cx="1000" cy="1455" r="5"/></g>

<!-- miner -->
<g transform="translate(625,1225) scale(1.3)" filter="url(#shadow)">
  <!-- legs -->
  <rect x="-26" y="30" width="20" height="44" rx="6" fill="#2a3a6a"/><rect x="6" y="30" width="20" height="44" rx="6" fill="#2a3a6a"/>
  <rect x="-30" y="68" width="28" height="12" rx="5" fill="#3a2010"/><rect x="4" y="68" width="28" height="12" rx="5" fill="#3a2010"/>
  <!-- body -->
  <rect x="-34" y="-20" width="68" height="60" rx="14" fill="#d8541a"/>
  <rect x="-34" y="10" width="68" height="8" fill="#ffd54a"/>
  <!-- bag -->
  <ellipse cx="-44" cy="16" rx="22" ry="26" fill="#a87a4a" stroke="#5a3a1a" stroke-width="4"/>
  <circle cx="-48" cy="-4" r="8" fill="#ffd54a"/>
  <!-- head -->
  <circle cx="0" cy="-48" r="30" fill="#f2c08a"/>
  <circle cx="10" cy="-50" r="4" fill="#2a1a10"/>
  <path d="M2 -36 q10 6 18 0" stroke="#7a3a1a" stroke-width="3" fill="none"/>
  <!-- helmet -->
  <path d="M-34 -56 Q0 -100 34 -56Z" fill="#ffc21a" stroke="#8a5a00" stroke-width="4"/>
  <rect x="-38" y="-60" width="76" height="10" rx="5" fill="#e0a010"/>
  <circle cx="18" cy="-72" r="10" fill="#fffbe0" filter="url(#glow)"/>
  <!-- arm + pickaxe swinging -->
  <g transform="rotate(-35 24 0)">
    <rect x="20" y="-10" width="16" height="44" rx="7" fill="#d8541a"/>
    <rect x="22" y="-100" width="10" height="120" rx="4" fill="#8a5a2a"/>
    <path d="M-20 -96 Q27 -130 80 -92 L74 -84 Q27 -112 -14 -88Z" fill="#c8d0dc" stroke="#4a5060" stroke-width="4"/>
  </g>
</g>
<!-- sparks from the swing -->
<g stroke="#ffe680" stroke-width="5" stroke-linecap="round" filter="url(#glow)">
  <path d="M708 1150l26-18M716 1176l32 0M700 1126l12-28"/>
</g>
<!-- depth gauge -->
<g class="t" font-size="34" font-weight="700" fill="#ffd98a" opacity=".85">
  <text x="1120" y="830" text-anchor="end">— 50 米</text>
  <text x="1120" y="1110" text-anchor="end">— 200 米</text>
  <text x="1120" y="1400" text-anchor="end">— 400 米</text>
</g>

<!-- title block -->
<rect x="0" y="0" width="1152" height="420" fill="#0b0710" opacity=".25"/>
<g class="t" text-anchor="middle" filter="url(#shadow)">
  <text x="576" y="240" font-size="230" font-weight="900" fill="#3a1a00" stroke="#3a1a00" stroke-width="28" stroke-linejoin="round" letter-spacing="20">淘金者</text>
  <text x="576" y="240" font-size="230" font-weight="900" fill="url(#gold)" stroke="#fff3c0" stroke-width="3" letter-spacing="20">淘金者</text>
  <text x="576" y="318" font-size="40" font-weight="700" fill="#ffe9b0" letter-spacing="24">GOLD DIGGER</text>
</g>
<g class="t" text-anchor="middle">
  <rect x="236" y="350" width="680" height="70" rx="35" fill="#1a0e08" opacity=".78" stroke="#ffcf5a" stroke-width="3"/>
  <text x="576" y="398" font-size="40" font-weight="800" fill="#ffffff">挖得越深，宝藏越亮！</text>
</g>

<!-- bottom badges -->
<g class="t" font-size="36" font-weight="800" text-anchor="middle">
  <g transform="translate(140,1350) rotate(-6)">
    <rect x="-120" y="-38" width="240" height="66" rx="14" fill="#ffd54a" stroke="#5a2a00" stroke-width="4"/>
    <text y="10" fill="#3a1a00">每局新矿井</text>
  </g>
</g>
<g class="t" text-anchor="middle">
  <rect x="64" y="1450" width="400" height="64" rx="32" fill="#120a14" opacity=".85" stroke="#ffcf5a" stroke-width="3"/>
  <text x="264" y="1494" font-size="32" font-weight="700" fill="#ffe9b0">三键上手 · 越挖越上瘾</text>
</g>
</svg>
</body></html>
